name: Mod CI

# No path filters: runtime-only and documentation-only PRs must both emit the
# required check. Push runs also attach evidence to the exact branch head, not
# only GitHub's synthetic PR merge commit (used by the task completion gate).
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mod validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Verify selected artwork regeneration and physical contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r assets/requirements.txt
          python assets/check.py --output "$RUNNER_TEMP/tc-art"
      - name: Check package, generated contracts and player documentation
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/tc-ci/reports"
          python tools/test_build.py
          python tools/planning_examples.py --check
          python tools/configuration_catalog.py --check
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/tc-ci/site"
          python tools/player_docs.py --check --site "$RUNNER_TEMP/tc-ci/site" \
            --report "$RUNNER_TEMP/tc-ci/reports/player-docs.json"
          python tools/build.py --output "$RUNNER_TEMP/tc-ci/package" \
            > "$RUNNER_TEMP/tc-ci/reports/package.json"
      - name: Install verified Factorio 2.0.77 headless engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            https://factorio.com/get-download/2.0.77/headless/linux64 \
            --output "$RUNNER_TEMP/tc-ci/factorio.tar.xz"
          printf '%s  %s\n' \
            c4efc11529f74d37c96933e291e0db73fd9f5aa4738913d9301b24680b3e947f \
            "$RUNNER_TEMP/tc-ci/factorio.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/tc-ci/factorio.tar.xz" -C "$RUNNER_TEMP/tc-ci"
          "$RUNNER_TEMP/tc-ci/factorio/bin/x64/factorio" --version \
            > "$RUNNER_TEMP/tc-ci/reports/engine-version.txt"
      - name: Check packaged sandbox and cold factory integration
        shell: bash
        run: |
          set -euo pipefail
          archive="$(jq -er '.path' "$RUNNER_TEMP/tc-ci/reports/package.json")"
          engine="$RUNNER_TEMP/tc-ci/factorio/bin/x64/factorio"
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/runtime" --mode base \
            --fixture tests.runtime_contract
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/runtime-budgets" --mode both \
            --fixture tests.runtime_budget_engine --production-context --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/compiler-cache" --mode both \
            --fixture tests.compiler_cache_contract
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/shell-contract" --mode both \
            --fixture tests.shell_contract
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/shell-cold" --mode both \
            --fixture tests.shell_cold --production-context --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/recipe-signals" --mode both \
            --fixture tests.logic_recipe_engine --production-context --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/logic" --mode both \
            --fixture tests.logic_engine --cold
          for layout in four-walls mixed; do
            python tools/monitor_animation.py --factorio "$engine" --archive "$archive" \
              --output "$RUNNER_TEMP/tc-ci/animation-$layout" --mode both --layout "$layout"
          done
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/gui-workspace" --mode both \
            --fixture tests.editor_workspace --data-fixture tests.candidate_data
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/rotation-guards" --mode both \
            --fixture tests.rotation_engine --data-fixture tests.candidate_data
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/gui-cold" --mode both \
            --fixture tests.editor_cold --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/monitor-cold" --mode both \
            --fixture tests.monitor_engine --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/integration" --mode both \
            --fixture tests.integration_engine --data-fixture tests.candidate_data \
            --production-context --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/lifecycle" --mode both \
            --fixture tests.lifecycle_engine --data-fixture tests.candidate_data \
            --production-context --cold
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/recipe-searcher" --mode both \
            --fixture tests.recipe_searcher_engine --data-fixture tests.recipe_searcher_data \
            --production-context --cold --upgrade-fixture
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/device-art" --mode both \
            --fixture tests.art_engine --data-fixture tests.art_data
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://github.com/SirEdvin/tweaked-computers/releases/download/alpha-0.1.8/tweaked-computers_0.1.8.zip \
            --output "$RUNNER_TEMP/tc-ci/legacy_0.1.8.zip"
          python tools/recipe_searcher_upgrade.py --factorio "$engine" --archive "$archive" \
            --legacy "$RUNNER_TEMP/tc-ci/legacy_0.1.8.zip" --output "$RUNNER_TEMP/tc-ci/recipe-install"

      - name: Check buffered presentation and released-save migration
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          archive="$(jq -er '.path' "$RUNNER_TEMP/tc-ci/reports/package.json")"
          engine="$RUNNER_TEMP/tc-ci/factorio/bin/x64/factorio"
          for fixture in monitor_snapshot_contract monitor_budget_contract monitor_optimization_contract; do
            python tools/smoke.py --factorio "$engine" --archive "$archive" \
              --output "$RUNNER_TEMP/tc-ci/$fixture" --mode both --fixture "tests.$fixture"
          done
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/monitor-components" --mode both \
            --fixture tests.monitor_component_contract --cold
          for workload in sparse full-blit; do
            python tools/monitor_performance.py --factorio "$engine" --archive "$archive" \
              --output "$RUNNER_TEMP/tc-ci/performance-$workload" --mode both \
              --ticks 1200 --max-gap 2 --workload "$workload"
          done
          for fixture in monitor_presentation_engine monitor_budget_engine monitor_plot_baseline_engine monitor_feedback_engine; do
            python tools/smoke.py --factorio "$engine" --archive "$archive" \
              --output "$RUNNER_TEMP/tc-ci/$fixture" --mode both --fixture "tests.$fixture" \
              --production-context --cold
          done
          python tools/smoke.py --factorio "$engine" --archive "$archive" \
            --output "$RUNNER_TEMP/tc-ci/monitor_buffer_engine" --mode both \
            --fixture tests.monitor_buffer_engine --cold
          for phase in waiting preparing ready retiring; do
            python tools/smoke.py --factorio "$engine" --archive "$archive" \
              --output "$RUNNER_TEMP/tc-ci/monitor-state-$phase" --mode both \
              --fixture "tests.monitor_state_$phase" --production-context --cold
          done
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://github.com/SirEdvin/tweaked-computers/releases/download/alpha-0.1.4/tweaked-computers_0.1.4.zip \
            --output "$RUNNER_TEMP/tc-ci/legacy_0.1.4.zip"
          python tools/monitor_upgrade.py --factorio "$engine" --archive "$archive" \
            --legacy "$RUNNER_TEMP/tc-ci/legacy_0.1.4.zip" --output "$RUNNER_TEMP/tc-ci/upgrade"
      - name: Retain focused verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tc-art/regeneration-differences.json
            ${{ runner.temp }}/tc-art/regeneration-environment.json
            ${{ runner.temp }}/tc-art/regenerated/
            ${{ runner.temp }}/tc-ci/reports/
            ${{ runner.temp }}/tc-ci/**/summary.json
            ${{ runner.temp }}/tc-ci/**/engine.log
            ${{ runner.temp }}/tc-ci/**/*-engine.log
            ${{ runner.temp }}/tc-ci/**/*-result.json
            ${{ runner.temp }}/tc-ci/**/command.json
            ${{ runner.temp }}/tc-ci/**/*-command.json
            ${{ runner.temp }}/tc-ci/runtime/**/summary.json
            ${{ runner.temp }}/tc-ci/runtime/**/engine.log
            ${{ runner.temp }}/tc-ci/gui-workspace/**/summary.json
            ${{ runner.temp }}/tc-ci/gui-workspace/**/engine.log
            ${{ runner.temp }}/tc-ci/gui-cold/**/summary.json
            ${{ runner.temp }}/tc-ci/gui-cold/**/engine.log
            ${{ runner.temp }}/tc-ci/gui-cold/**/*-engine.log
            ${{ runner.temp }}/tc-ci/gui-cold/**/*-result.json
            ${{ runner.temp }}/tc-ci/monitor-cold/**/summary.json
            ${{ runner.temp }}/tc-ci/monitor-cold/**/engine.log
            ${{ runner.temp }}/tc-ci/monitor-cold/**/*-engine.log
            ${{ runner.temp }}/tc-ci/monitor-cold/**/*-result.json
            ${{ runner.temp }}/tc-ci/integration/**/summary.json
            ${{ runner.temp }}/tc-ci/integration/**/engine.log
            ${{ runner.temp }}/tc-ci/integration/**/*-engine.log
            ${{ runner.temp }}/tc-ci/integration/**/*-result.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: false
          include-hidden-files: false
