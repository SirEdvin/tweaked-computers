name: Player documentation

on:
  push:
    branches: [main]
    paths: ['docs/player/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      publish_ref:
        description: 'Source: refs/heads/main, exact TC17 branch, or refs/tags/alpha-*'
        required: true
        default: refs/heads/main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select trusted source
        id: select
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          PUBLISH_REF: ${{ inputs.publish_ref }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$WORKFLOW_REF" = refs/heads/main
            git check-ref-format "$PUBLISH_REF"
            case "$PUBLISH_REF" in
              refs/heads/main|refs/heads/tweaked-computers/t_e6cbf814-tc17-publish-the-complete-alpha-on-facto|refs/tags/alpha-*) ;;
              *) echo 'Ref is not approved for publication'; exit 1 ;;
            esac
            echo "ref=$PUBLISH_REF" >> "$GITHUB_OUTPUT"
          else
            echo 'ref=${{ github.sha }}' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.ref }}
          persist-credentials: false
      - name: Record immutable source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - name: Record published source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > site/source-commit.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
