[entity-description]
tc-device=Requires electricity for active services. Connect red or green wire directly to the device. Logic Input/Output and configurator Factory targets are separate sockets; roles never connect internally.
tc-computer=Connect red or green wire directly to the computer with ordinary clicks. Clear the cursor, then Ctrl + left click to edit its program. Requires electricity to execute; network wires remain passive.
tc-kv=Connect red or green wire directly to the database. Requires electricity for data operations; network wires remain passive.
tc-monitor=Connect red or green wire directly to the monitor bezel. Requires electricity to display and update content; adjacent tiles share a screen, not a network connection.
tc-logic=Network connects directly to the logic handler; separate Input and Output sockets face factory signals. The three roles never connect internally.
tc-configurator=Network connects directly to the configurator; the separate Factory targets socket connects supported machines. Roles never connect internally.
tc-port-input=Input role only. No connection to NETWORK or OUTPUT.
tc-port-network=Passive computer network role. Wires retain native continuity; no mod-generated signals.
tc-port-output=Output role only. One bank contributes equally to its red and green wires.
tc-port-targets=Configuration target role only. Connect factory devices here, separately from NETWORK.

