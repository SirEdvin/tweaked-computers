[tc-configurator]
help-title=Device configurator
help=Connect NETWORK to computers and TARGETS to factory devices. Select the target wire separately. Inspect copied capabilities and native-mode restrictions before setting complete fields or combinator parameters. Constant sections use getSections/addSection/setSection/removeSection; indexes shift after removal. Shared filters require explicit group="" detachment; nonmanual sections are protected. Factory settings persist after stop/disconnection. Recovery failures retain target-local diagnostics for host attention.
