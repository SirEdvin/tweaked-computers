[entity-description]
tc-monitor=Adjacent same-direction monitors share an in-world color display without electricity. With an empty cursor, Ctrl + left click a character cell to activate it. Rebind the shared interaction action in Controls.
[tc-monitor]
touch-busy=Monitor interaction queue is busy. Try again shortly.
help=Monitor: byte-cell write/blit, cursor and blink, scrolling, 16 shared palette colors, half-step scales 0.5–5. Adjacent same-force/surface/direction tiles merge geometrically without connecting their wires. Ctrl + left click activates a cell; see docs/monitor.md for methods, limits and alpha caveats.
