monitor-help=Tile dimensions follow the display's local axes. Terminal sizes are character cells, not pixels. Ordinary opening inspects; Ctrl-click still touches the display.
logic-help=Live circuit inputs, sampled independently. Output shows only this handler's own signals, shared across both output wires. Read-only; short pulses between samples may be missed.
