kv-help=Read-only snapshot; Refresh observes program changes and expiry. Quotes and backslashes are backslash-escaped. Control/high bytes and brackets use hexadecimal byte escapes (backslash-x-HH). Values use 512-original-byte chunks; every chunk is reachable. List previews may be shortened.
targets-help=Target-side networks only. Unique counts deduplicate both wires; Red and Green overlap and must not be added. Connected relays and unsupported targets are included. Refresh never changes configuration.
prototype=Entity prototype
unique=Unique
red=Red
green=Green
entity-type=Entity type
tiles=Connected tiles: __1__ × __2__ (__3__ total)
terminal=Terminal: __1__ columns × __2__ rows
scale=Text scale: __1__
monitor-help=Tile dimensions follow the display's local axes. Terminal sizes are character cells, not pixels. Ordinary opening inspects; Ctrl-click still touches the display.
logic-help=Independent red/green observations attempted every 15 ticks when admitted; each has its own sample tick. A complete pair spans at most 30 ticks, not an atomic circuit snapshot. Pulses may be missed. Output is this handler's own contribution, shared across both output wires, not the network total.
inputs=Input signals
outputs=Output signals (own bank)
output=Own output — both wire colors
