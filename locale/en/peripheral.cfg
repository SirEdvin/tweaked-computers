[tc-help]
peripheral-network=Connect NETWORK ports using one wire colour all the way. Red and green are separate discovery channels. Ordinary poles, ghosts, other forces, and INPUT/OUTPUT/TARGETS ports never relay discovery. Unsupported wires are left in place.
peripheral-calls=Use dot calls: peripheral.getNames("red"), peripheral.wrap(name, "red"), device.getLimits(). Names identify devices, not coordinates or labels. Save the name and colour in computer state; wrap again in a later callback. Every device call rechecks a live physical path.
peripheral-errors=Discovery limit or pending errors are not an empty inventory. Retry on a later event/tick; do not busy-wait. Unpowered devices remain physically discoverable, but only metadata and getLimits are available. Known facade name/colour remain inspectable after detach and grant no target access.
peripheral-events=Register computer.on("peripheral_attach", "attached") or computer.on("peripheral_detach", "detached"). These report later transitions, not an initial inventory. Query getNames after registration. Detach clears still-owned logic output independently of guest handlers.
