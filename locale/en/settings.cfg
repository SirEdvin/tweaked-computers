[mod-setting-description]
tc-compiler-cache-bytes=World-wide disposable compiler plans, continuation text and accounting traces. Default: 8388608 deterministic byte-accounting units, not measured Lua heap bytes. Cached proofs are evicted as a batch under capacity pressure; a proof too large to retain is rebuilt. Eviction, save/load and different cache warmth never change accepted work or renew credits. This setting does not limit program/source length or erase active invocations. Higher values may increase host memory use.
tc-compile-work=Maximum source-compilation work units charged to one computer in a simulation tick. Validation, activation and callback reconstruction share this allowance. Changes apply during the game without resetting spent credits. Higher values may reduce UPS.
tc-callback-work=Maximum execution work units charged to one computer in a simulation tick. Changes apply during the game without resetting spent credits. Higher values may reduce UPS.
tc-callback-allocations=Maximum guest-allocation units charged to one computer in a simulation tick; these are accounting units, not host-memory bytes. Changes apply during the game without resetting spent credits. Higher values may increase memory pressure and reduce UPS.
tc-host-work-per-tick=Shared work ceiling for all computers in a simulation tick, including the effective world-maintenance reservation. Compilation, execution and allocation charges share the remaining allowance. Prefer a value at least as large as the sum of the three per-computer budgets plus maintenance. Smaller values can defer callbacks or cause E_BUDGET. Changes do not reset spent credits. Higher values may reduce UPS.
tc-maintenance-work-per-tick=Shared work allowance for device discovery, power and signal sampling, timers, notifications and monitor presentation in a simulation tick. Default: 200000 work units. The effective allowance is the smaller of this request and shared host work minus one; it never increases shared host work. Work waits when transiently exhausted; an indivisible operation larger than the full allowance reports a recoverable refusal. Increasing maintenance leaves less guest work. Spent credits and the current tick's render reservation are retained when settings change. Higher values may reduce UPS; units are deterministic accounting costs, not milliseconds or a frame-rate target.
tc-runtime-memory-bytes=Default: 8388608 deterministic byte-accounting units per computer, including live values, suspended frames, temporaries and accounting metadata; not measured Lua heap bytes. Unsafe growth refuses recoverably before effects. Lowering preserves accepted contents and progress; release values or raise the allowance to admit new growth. Higher values can increase host memory use.
tc-host-memory-bytes=Default: 134217728 deterministic byte-accounting units shared by retained host records, device models, snapshots, native-object accounting and pending work. Unsafe growth refuses recoverably; accepted data is not erased by lowering. Cleanup and controls remain available. Not a measurement of the process heap.
tc-state-bytes=Default: 65536 accounted bytes of application state per computer. Writes exceeding available storage refuse atomically. Lowering does not erase accepted values; reads, deletion and non-growing recovery remain possible.
tc-shell-value-bytes=Default: 16384 accounted bytes in each computer's committed Console scratch graph. An oversized replacement refuses without publishing a partial graph or losing the previous values. Lowering preserves accepted data.
tc-draft-storage-bytes=Default: 1048576 accounted bytes of retained drafts per player. New growth refuses visibly when full; existing drafts are never evicted merely to admit another. Reduce drafts or raise the allowance.
tc-event-queue-bytes=Default: 65536 accounted bytes of queued event envelopes, entry metadata and payloads per computer, with no separate event-count ceiling. Newest overflowing deliveries are dropped, including a single event larger than the allowance. Accepted events and cumulative loss diagnostics survive lowering and reload. Lifecycle start does not use this droppable queue.
tc-pending-work-bytes=Default: 1048576 accounted bytes of accepted non-event work per computer, also charged to shared host memory. New commands or jobs refuse visibly before acceptance when full; accepted work waits or completes and is never silently dropped as an event.
tc-host-stack-depth=Default: 32 nested levels in remaining recursive host helpers. Refuses recoverably before unsafe recursion. This is not a maximum inventory size or an artificial frame limit for iterative guest execution.
tc-console-bytes=Default: 16384 accounted bytes of disposable Console history per computer, including text and entry metadata. There is no separate entry-count ceiling. Oldest entries are evicted when new output needs space; one entry larger than the complete allowance refuses rather than being silently cut. Accepted drafts, application state and event loss totals are retained independently.
tc-render-commit-work=Default: 160000 work units for whole-frame/group monitor visibility publication, within shared host work. Preparation can span ticks; publication remains atomic. If the complete commit cannot fit the effective allowance, status reports the blockage instead of publishing a partial group.
tc-event-drop-warning-interval=Default: 600 simulation ticks between event-loss warnings for one computer. This controls warning frequency, not counter accuracy. Suppressed warnings never suppress cumulative losses or enqueue more events.
tc-speaker-sound-page-size=Default: 50 records per speaker sound-discovery page. This controls page size, not the total native catalogue. Continue with the returned cursor to enumerate all supported sounds.
tc-monitor-width-tiles=Default and maximum: 6 tiles per new monitor's local horizontal axis; minimum: 1. Lowering alone does not repartition or erase an existing display. Ordinary explicit physical geometry changes retain their documented behavior.
tc-monitor-height-tiles=Default and maximum: 6 tiles per new monitor's local vertical axis; minimum: 1. Lowering alone does not repartition or erase an existing display. Ordinary explicit physical geometry changes retain their documented behavior.
tc-kv-keys=Default: 128 live keys per KV database. New growth refuses atomically when full. Lowering preserves existing keys and permits reads, expiry, deletion and non-growing recovery.
tc-kv-bytes=Default: 16384 live key/content bytes per KV database. New growth refuses atomically; lowering preserves accepted contents. Effective new-write admission also respects configured snapshot metadata headroom so accepted values are not lost during mining.
tc-kv-key-bytes=Default: 256 bytes per KV key or hash-field name. New oversized names refuse. Lowering preserves access to previously accepted names for reads and recovery.
tc-kv-value-bytes=Default: 8192 bytes per KV string or hash-field value. New oversized growth refuses atomically. Previously accepted values remain readable, reducible and transportable after lowering.
tc-kv-hash-fields=Default: 128 fields per KV hash. New field growth refuses atomically; existing fields remain readable and removable after lowering.
tc-kv-hash-bytes=Default: 8192 accounted bytes per KV hash. New growth refuses atomically. Lowering does not discard accepted fields or values.
tc-kv-total-hash-fields=Default: 256 live hash fields across one KV database. New growth refuses atomically; reads, expiry and deletion remain available above a lowered allowance.
tc-kv-command-arguments=Default: 128 arguments per KV command. New commands beyond this explicit KV allowance refuse before mutation; previously accepted contents remain available for recovery.
tc-kv-command-bytes=Default: 65536 combined input bytes per KV command. Oversized new commands refuse before mutation. This is not a truncation limit on stored contents or browser results.
tc-kv-snapshot-bytes=Default: 65536 accounted bytes for new KV snapshot/transfer admission, including metadata. Effective write capacity reserves transport headroom before mutation. Already accepted contents remain transportable after lowering; mining never silently discards excess data.
