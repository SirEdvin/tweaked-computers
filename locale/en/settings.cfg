[mod-setting-name]
tc-compile-work=Compilation work per computer per tick
tc-host-work-per-tick=Shared host work per tick
tc-maintenance-work-per-tick=World maintenance work per tick

[mod-setting-description]
tc-compile-work=Maximum source-compilation work units charged to one computer in a simulation tick. Validation, activation and callback reconstruction share this allowance. Changes apply during the game without resetting spent credits. Higher values may reduce UPS.
tc-host-work-per-tick=Maximum shared host work per simulation tick, including the effective maintenance reservation. Source validation, reconstruction, and API work share the remaining allowance. Earlier spending can delay preparation until a later tick. After execution starts, host-work refusal causes E_BUDGET. These limits cannot stop infinite Lua loops or limit temporary memory. Changes do not reset spent credits. Higher values can reduce UPS.
tc-maintenance-work-per-tick=Shared work allowance for due physical observation, watched signal sampling, timers, notifications and pending monitor presentation in a simulation tick. Default: 200000. Supported range: 200000–100000000; lower values are unsupported because they can starve indivisible topology and rendering work. The effective allowance is the smaller of this request and shared host work minus one; it never increases shared host work. Increasing maintenance leaves less guest work. Spent credits and the current tick's render reservation are retained when settings change. Higher values may reduce UPS; units are provisional accounting costs, not milliseconds or a frame-rate target.
