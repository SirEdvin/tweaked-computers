[tc-help]
kv-database=Each physical KV database is independent and shared by authorized computers on its NETWORK wires. Obtain with peripheral.find("kv_database", "red"). Use dot calls. Keys, fields and values must be byte strings; empty strings and embedded NUL are valid. Missing GET/HGET returns nil, not an empty string.
kv-commands=Strings/keys: get, set, del, exists, type. Hashes: hget, hset, hdel, hexists, hgetall, hlen. Time: expire, ttl, persist. Metadata: getLimits. SET returns "OK" and clears TTL. HSET accepts complete field/value pairs; last duplicate wins. Hash calls on strings and GET on hashes throw E_WRONGTYPE. HGETALL returns a copied map.
kv-expiry=EXPIRE uses integer simulation seconds (60 ticks), not real time. TTL rounds to nearest second: -2 absent, -1 persistent, zero can still be live. Keys disappear at their absolute deadline even if cleanup is deferred. Outages and carrying a tagged item do not renew expiry. SET clears TTL; HSET/HDEL retain it until the final field is removed.
kv-limits=Initial limits: 128 keys, 16384 content bytes, 256-byte keys/fields, 8192-byte values, 128 fields and 8192 field/value bytes per hash, 256 fields per database, 128 command arguments. Query getLimits for the complete current limits. Commands validate and stage their whole change; capacity refusal keeps the old data/TTL. Native callback work/allocation caps still apply.
kv-lifecycle=Player/robot mining keeps database contents and absolute deadlines in one tagged item; replacement gets a new identity. Blueprints/clones start empty. Destruction destroys the database. Malformed item snapshots are refused and refunded intact. See docs/kv-database.md for full signatures, duplicate rules, expiry, limits and a native example.
